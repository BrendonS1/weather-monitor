<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather database · NZNE</title>
<meta name="theme-color" content="#007E33">
<!-- Same icon as www.nsac.co.nz -->
<link rel="icon" type="image/png" sizes="270x270" href="https://www.nsac.co.nz/wp-content/uploads/2019/06/cropped-North-Shore-Aero-Club-Logo-Favicon-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #007E33;
    --green-dark: #00662A;
    --green-bright: #00B84D;
    --ground: #E4EBE6;
    --panel: #FFFFFF;
    --paper: #F3F6F4;
    --line: #D3DED7;
    --ink: #1A1A1A;
    --muted: #555F59;
    --error-bg: #FDECEA;
    --error-ink: #8E1B10;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Roboto Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.4;
  }
  a { color: var(--green-dark); }
  :focus-visible { outline: 3px solid var(--green-bright); outline-offset: 2px; }
  h1, h2, p { margin: 0; }
  h2 { font-size: 19px; font-weight: 700; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .lbl { font-size: 14px; font-weight: 600; color: var(--muted); }

  .masthead { background: var(--green); color: #fff; }
  .masthead .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding-top: 16px; padding-bottom: 16px; }
  .masthead h1 { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .masthead .sub { font-size: 15px; font-weight: 600; opacity: 0.92; }
  .masthead a { color: #fff; font-weight: 700; font-size: 16px; padding: 8px 0; }

  main.wrap { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; padding-bottom: 40px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }

  /* Password */
  .pw-row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=password], input[type=text] {
    font: inherit; font-size: 17px; min-height: 44px; padding: 8px 12px; flex: 1 1 220px; max-width: 360px;
    border: 2px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink);
  }
  input:focus { border-color: var(--green); outline: none; }
  .pw-state { font-size: 14px; color: var(--muted); }

  /* Buttons */
  .btn {
    font: inherit; font-size: 16px; font-weight: 700; min-height: 44px; padding: 0 18px;
    border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--green); color: #fff; border: 2px solid var(--green); }
  .btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn-outline { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }
  .btn-outline:hover { background: var(--green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--green-dark); border: 2px solid transparent; padding: 0 8px; }
  .btn:disabled { opacity: 0.6; cursor: progress; }

  .quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .quick .btn { justify-content: center; text-align: center; width: 100%; }
  .quick-desc { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .quick .btn { flex-direction: column; gap: 0; padding: 8px 10px; line-height: 1.2; }
  .quick .btn:hover .quick-desc { color: #E8F5EC; }

  /* Editor */
  textarea {
    font-family: 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5;
    width: 100%; min-height: 120px; padding: 12px; resize: vertical;
    border: 2px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink);
  }
  textarea:focus { border-color: var(--green); outline: none; background: #fff; }
  .editor-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .hint { font-size: 14px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border: 3px solid rgba(255,255,255,0.45); border-top-color: #fff; border-radius: 50%; display: none; }
  .btn.busy .spinner { display: inline-block; }
  @media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 0.7s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Messages */
  .error { background: var(--error-bg); color: var(--error-ink); border-radius: 6px; padding: 12px 16px; font-weight: 600; overflow-wrap: anywhere; }

  /* Results */
  .meta { font-size: 15px; color: var(--muted); }
  .table-box { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--paper); font-size: 14px; font-weight: 700; color: var(--muted); border-bottom: 2px solid var(--line); }
  tbody tr:nth-child(even) td { background: #FAFCFB; }
  tbody tr:hover td { background: #EEF5F0; }
  td.n, th.n { text-align: right; }
  td.null { color: #8A938E; font-style: italic; }
  /* Keep the first column (usually the time) visible while scrolling sideways. */
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; border-right: 1px solid var(--line); }
  thead th:first-child { z-index: 3; background: var(--paper); }
  .empty { padding: 20px; color: var(--muted); }

  footer { font-size: 14px; color: var(--muted); padding: 0 2px; }

  @media (min-width: 720px) {
    .wrap { padding: 0 32px; }
    main.wrap { gap: 20px; padding-top: 20px; }
    .panel { padding: 20px 22px; gap: 14px; }
    .quick { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .masthead h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div>
      <h1>North Shore</h1>
      <span class="sub">NZNE weather database</span>
    </div>
    <a href="/">Back to the weather</a>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-labelledby="pw-h">
    <h2 id="pw-h"><label for="password">Password</label></h2>
    <form class="pw-row" id="pwForm" autocomplete="on" onsubmit="return false">
      <input type="text" name="username" value="query" autocomplete="username" hidden>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Query password" aria-describedby="pwState">
      <button type="button" class="btn btn-quiet" id="pwToggle" aria-pressed="false">Show</button>
    </form>
    <p class="pw-state" id="pwState">Remembered until you close this tab.</p>
  </section>

  <section class="panel" aria-labelledby="quick-h">
    <h2 id="quick-h">Quick queries</h2>
    <div class="quick">
      <button type="button" class="btn btn-outline" data-preset="latest">Latest 10<span class="quick-desc">Most recent readings</span></button>
      <button type="button" class="btn btn-outline" data-preset="today">Today<span class="quick-desc">Since midnight NZ time</span></button>
      <button type="button" class="btn btn-outline" data-preset="count">Record count<span class="quick-desc">Total, first and latest</span></button>
      <button type="button" class="btn btn-outline" data-preset="tables">Tables<span class="quick-desc">What's in the database</span></button>
    </div>
  </section>

  <section class="panel" aria-labelledby="sql-h">
    <div class="panel-head">
      <h2 id="sql-h"><label for="sql">Your own query</label></h2>
      <span class="hint">Read-only: SELECT queries only</span>
    </div>
    <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT * FROM weather_update ORDER BY device_utc_ts DESC LIMIT 10;"></textarea>
    <div class="editor-row">
      <button type="button" class="btn btn-primary" id="runBtn"><span class="spinner" aria-hidden="true"></span><span id="runLabel">Run query</span></button>
      <span class="hint" id="kbdHint">Ctrl+Enter also runs it</span>
    </div>
  </section>

  <p class="error" id="error" role="alert" hidden></p>

  <section class="panel" id="results" aria-labelledby="res-h" hidden>
    <div class="panel-head">
      <h2 id="res-h">Results</h2>
      <button type="button" class="btn btn-quiet" id="csvBtn">Download CSV</button>
    </div>
    <p class="meta" id="resultsMeta" aria-live="polite"></p>
    <div class="table-box" tabindex="0" aria-label="Query results, scrollable">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>North Shore Airport (NZNE) weather database. Times in the quick queries are NZ local time.</footer>
</main>

<script>
(function () {
  'use strict';

  // Deployed query-server URL
  const QUERY_URL = 'https://query-weather-db-service-production.up.railway.app/query';

  // Presets read weather_update: one parsed row per station report, kept
  // for 2 years. (weather_data holds raw snapshots for 30 days only, and
  // its time column is captured_at, not timestamp.) Times shown in NZ time.
  const COLS = "to_char(device_utc_ts AT TIME ZONE 'Pacific/Auckland', 'YYYY-MM-DD HH24:MI') AS nz_time, " +
    "wind_dir_deg_mag AS dir_mag, wind_avg, wind_max_10 AS gust_10min, wind_rwy_fav AS runway, wind_xwind AS crosswind, " +
    "temp_out_c AS temp, dew_out_c AS dew, hum_out_pct AS humidity, sea_press_hpa AS qnh_msl, rain_rate";
  const TODAY_NZ = "(date_trunc('day', now() AT TIME ZONE 'Pacific/Auckland') AT TIME ZONE 'Pacific/Auckland')";
  const PRESETS = {
    latest: `SELECT ${COLS} FROM weather_update ORDER BY device_utc_ts DESC LIMIT 10;`,
    count: "SELECT COUNT(*) AS total_records, " +
      "to_char(MIN(device_utc_ts) AT TIME ZONE 'Pacific/Auckland', 'YYYY-MM-DD HH24:MI') AS first_record, " +
      "to_char(MAX(device_utc_ts) AT TIME ZONE 'Pacific/Auckland', 'YYYY-MM-DD HH24:MI') AS latest_record " +
      "FROM weather_update;",
    today: `SELECT ${COLS} FROM weather_update WHERE device_utc_ts >= ${TODAY_NZ} ORDER BY device_utc_ts DESC;`,
    tables: "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"
  };

  const $ = (id) => document.getElementById(id);
  const pw = $('password'), sqlBox = $('sql'), runBtn = $('runBtn'), errorEl = $('error');
  let lastResult = null;

  // Password: kept for this tab only.
  try { const saved = sessionStorage.getItem('queryPassword'); if (saved) pw.value = saved; } catch (e) {}
  pw.addEventListener('input', () => { try { sessionStorage.setItem('queryPassword', pw.value); } catch (e) {} });
  $('pwToggle').addEventListener('click', (e) => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-pressed', String(show));
  });

  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('kbdHint').textContent = '⌘+Enter also runs it';

  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    sqlBox.value = PRESETS[b.dataset.preset];
    runQuery();
  }));
  runBtn.addEventListener('click', runQuery);
  sqlBox.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  function setBusy(busy) {
    runBtn.disabled = busy;
    runBtn.classList.toggle('busy', busy);
    $('runLabel').textContent = busy ? 'Running…' : 'Run query';
    document.querySelectorAll('[data-preset]').forEach(b => { b.disabled = busy; });
  }

  async function runQuery() {
    const password = pw.value;
    const sql = sqlBox.value.trim();
    errorEl.hidden = true;

    if (!password) { showError('Enter the query password first.'); pw.focus(); return; }
    if (!sql) { showError('Write a query, or pick one of the quick queries.'); sqlBox.focus(); return; }

    setBusy(true);
    const started = performance.now();
    try {
      const resp = await fetch(QUERY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, sql })
      });
      let data = {};
      try { data = await resp.json(); } catch (e) {}
      if (resp.status === 403) { showError('That password is not right.'); pw.focus(); return; }
      if (!resp.ok || data.error) { showError(data.error || `The query server returned ${resp.status}.`); return; }
      renderResults(data.columns || [], data.rows || [], performance.now() - started);
    } catch (err) {
      showError('Could not reach the query server. Check your connection and try again.');
    } finally {
      setBusy(false);
    }
  }

  const isNumeric = (v) => typeof v === 'number' || (typeof v === 'string' && v !== '' && isFinite(Number(v)) && !/^0\d/.test(v));

  function renderResults(columns, rows, ms) {
    lastResult = { columns, rows };
    const thead = $('thead'), tbody = $('tbody');
    thead.replaceChildren(); tbody.replaceChildren();

    // A column is numeric when every non-null value in it is a number.
    const numeric = columns.map((_, c) => rows.length > 0 && rows.every(r => r[c] == null || isNumeric(r[c])) && rows.some(r => r[c] != null));

    const hr = document.createElement('tr');
    columns.forEach((name, c) => {
      const th = document.createElement('th');
      th.scope = 'col'; th.textContent = name;
      if (numeric[c]) th.className = 'n';
      hr.append(th);
    });
    thead.append(hr);

    if (!rows.length) {
      const tr = document.createElement('tr'); const td = document.createElement('td');
      td.colSpan = Math.max(1, columns.length); td.className = 'empty'; td.textContent = 'No rows matched.';
      tr.append(td); tbody.append(tr);
    } else {
      const frag = document.createDocumentFragment();
      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach((cell, c) => {
          const td = document.createElement('td');
          if (cell == null) { td.textContent = 'null'; td.className = 'null'; }
          else {
            td.textContent = typeof cell === 'object' ? JSON.stringify(cell) : String(cell);
            if (numeric[c]) td.className = 'n';
          }
          tr.append(td);
        });
        frag.append(tr);
      });
      tbody.append(frag);
    }

    const secs = ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(1)} s`;
    $('resultsMeta').textContent = `${rows.length.toLocaleString('en-NZ')} row${rows.length === 1 ? '' : 's'}, ${columns.length} column${columns.length === 1 ? '' : 's'}, in ${secs}.`;
    $('csvBtn').hidden = !rows.length;
    $('results').hidden = false;
    $('results').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  $('csvBtn').addEventListener('click', () => {
    if (!lastResult) return;
    const q = (v) => {
      if (v == null) return '';
      const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [lastResult.columns.map(q).join(',')].concat(lastResult.rows.map(r => r.map(q).join(',')));
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    a.download = `nzne-query-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
